<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#aeb9b4">
  <title>EROPEL</title>
  <link rel="stylesheet" href="assets/css/site.css">
</head>
<body class="entrance-page">
  <main class="landscape" aria-label="Entrance to EROPEL">
    <div class="sky" aria-hidden="true"><span class="cloud cloud-one"></span><span class="cloud cloud-two"></span></div>
    <div class="field" aria-hidden="true"></div>
    <button class="doorway" type="button" aria-label="Enter EROPEL">
      <span class="door-frame">
        <span class="door-void"></span>
        <span class="door">
          <span class="door-name">EROPEL</span>
          <span class="handle"></span>
        </span>
      </span>
      <span class="door-shadow" aria-hidden="true"></span>
    </button>
    <p class="entrance-hint" aria-hidden="true">OPEN</p>
  </main>
  <div class="threshold" aria-hidden="true"></div>
  <script src="assets/js/entrance.js"></script>
</body>
</html>
